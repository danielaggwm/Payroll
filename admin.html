<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Brickell — Admin (Firebase)</title>
<style>
  :root{ --bg:#0f1720;--panel:#17212b;--panel2:#1e2b38;--line:#2b3a49;--ink:#e8eef4;--muted:#93a4b5;--faint:#6b7c8d;
    --accent:#4c9be8;--accent-weak:#22384e;--green:#3fb57a;--amber:#e0a53d;--red:#e0685f;--violet:#9a8cf0;
    --shadow:0 8px 24px rgba(0,0,0,.35);--radius:14px;color-scheme:dark; }
  [data-theme="light"]{ --bg:#eef2f6;--panel:#fff;--panel2:#f5f8fb;--line:#dde5ec;--ink:#17242f;--muted:#5a6b7a;--faint:#8a9aa8;
    --accent:#1f6fd0;--accent-weak:#e3eefb;--green:#1e9e63;--amber:#b9822a;--red:#c94b41;--violet:#6f5fd6;--shadow:0 8px 24px rgba(16,40,60,.08);color-scheme:light; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .wrap{max-width:860px;margin:0 auto;padding:22px 18px 70px}
  header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
  .logo{height:38px;width:auto;display:block}
  a.btn{text-decoration:none;color:var(--ink)}
  h1{font-size:18px;margin:0;font-weight:700} .sub{font-size:12px;color:var(--muted)} .spacer{flex:1}
  select,button,input{font:inherit;color:var(--ink)}
  .btn{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 13px;cursor:pointer} .btn:hover{border-color:var(--accent)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff} .btn.small{padding:6px 10px;font-size:13px;border-radius:8px} .btn.ghost{background:transparent}
  .btn.green{background:var(--green);border-color:var(--green);color:#06210f} .btn:disabled{opacity:.5;cursor:not-allowed}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)} .pad{padding:18px}
  input.f{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:9px 11px;color:var(--ink)} input.f:focus{outline:none;border-color:var(--accent)}
  label.fl{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  .pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:11px;font-weight:700}
  .pill.draft{background:var(--accent-weak);color:var(--accent)} .pill.submitted{background:rgba(224,165,61,.16);color:var(--amber)} .pill.approved{background:rgba(63,181,122,.16);color:var(--green)} .pill.none{background:var(--panel2);color:var(--faint)}
  .kv{display:flex;justify-content:space-between;padding:5px 0;font-size:13px;color:var(--muted)} .kv b{color:var(--ink)}
  .item{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;background:var(--panel2)}
  .err{color:var(--red);font-size:13px;margin-top:8px;min-height:18px}
  .login-wrap{max-width:380px;margin:8vh auto 0;padding:0 18px}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:10px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:60} .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .hide{display:none!important} .field{margin-bottom:12px}
  h2.sec{font-size:15px;margin:24px 0 10px;display:flex;align-items:center;gap:8px}
</style>
</head>

    <div><h1>Payroll &amp; PTO Tracker</h1><div class="sub" id="who">—</div></div>
    <div class="spacer"></div>
    <a class="btn small ghost" href="./index.html" title="Open the payroll calculator">Payroll tracker →</a>
    <button class="btn small ghost" id="themeBtn">◐</button>
    <button class="btn small" id="signout">Sign out</button>
  </header>
  <div id="notadmin" class="panel pad hide"><b>This login isn't the admin account.</b><div class="sub" style="margin-top:6px">Sign in with admin@brickellmg.com to manage payroll.</div></div>
  <div id="body" class="hide">
    <h2 class="sec">Approvals <span class="sub" id="apCount"></span><span class="spacer"></span><button class="btn small" id="refresh">Refresh</button></h2>
    <div id="approvals"></div>
    <h2 class="sec">Setup</h2>
    <div class="panel pad" id="setup"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script type="module">
import { auth, db, ADMIN_EMAIL } from "./db.js";
import { signInWithEmailAndPassword, signOut, onAuthStateChanged, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { collection, doc, getDoc, getDocs, setDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import * as C from "./core.js";

const $=id=>document.getElementById(id);
let COMPANY=null, EMPS=[], YEAR=(new Date()).getFullYear();
function toast(m){ const t=$("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),2600); }
document.documentElement.setAttribute("data-theme", localStorage.getItem("brk_theme")||"dark");
$("themeBtn").onclick=()=>{ const c=document.documentElement.getAttribute("data-theme")==="light"?"dark":"light"; document.documentElement.setAttribute("data-theme",c); localStorage.setItem("brk_theme",c); };

$("li-btn").onclick=login; $("li-pass").addEventListener("keydown",e=>{if(e.key==="Enter")login();});
$("li-forgot").onclick=(e)=>{ e.preventDefault(); forgotPw(); };
async function forgotPw(){
  const err=$("li-err"); err.style.color="";
  const em=$("li-email").value.trim();
  if(!em){ err.textContent="Type your email above first, then click Forgot password."; return; }
  try{ await sendPasswordResetEmail(auth,em);
    err.style.color="var(--green)"; err.textContent="If that email has an account, a reset link is on its way. Check your inbox (and spam)."; }
  catch(e){ if((e.code||"").includes("invalid-email")){ err.textContent="That doesn't look like a valid email."; }
    else { err.style.color="var(--green)"; err.textContent="If that email has an account, a reset link is on its way. Check your inbox (and spam)."; } }
}
async function login(){ $("li-err").textContent=""; const em=$("li-email").value.trim(), pw=$("li-pass").value;
  if(!em||!pw){ $("li-err").textContent="Enter email and password."; return; }
  $("li-btn").disabled=true;
  try{ await signInWithEmailAndPassword(auth,em,pw); }catch(e){ $("li-err").textContent="Sign in failed: "+(e.code||e.message); $("li-btn").disabled=false; } }
$("signout").onclick=()=>signOut(auth);
$("refresh").onclick=()=>loadAndRender();

onAuthStateChanged(auth, async(user)=>{
  if(!user){ $("app").classList.add("hide"); $("login").classList.remove("hide"); $("li-btn").disabled=false; return; }
  $("login").classList.add("hide"); $("app").classList.remove("hide"); $("who").textContent="Admin · "+user.email;
  if(user.email!==ADMIN_EMAIL){ $("notadmin").classList.remove("hide"); $("body").classList.add("hide"); return; }
  $("notadmin").classList.add("hide"); $("body").classList.remove("hide");
  await loadAndRender();
});

async function loadAndRender(){
  $("approvals").innerHTML=`<div class="sub">Loading…</div>`;
  const cfg=await getDoc(doc(db,"config","company"));
  COMPANY = cfg.exists()?cfg.data():null;
  EMPS=[];
  const es=await getDocs(collection(db,"employees"));
  for(const e of es.docs){
    const emp={id:e.id, ...e.data(), months:{}};
    const ts=await getDocs(collection(db,"employees",e.id,"timesheets"));
    ts.forEach(t=>emp.months[t.id]=t.data());
    EMPS.push(emp);
  }
  renderApprovals(); renderSetup();
}

function renderApprovals(){
  if(!COMPANY){ $("approvals").innerHTML=`<div class="panel pad">No data yet — run <b>Import</b> below first.</div>`; $("apCount").textContent=""; return; }
  // gather submitted months
  const subs=[];
  EMPS.forEach(emp=>Object.keys(emp.months).forEach(k=>{ if(emp.months[k].status==="submitted") subs.push({emp,k,rec:emp.months[k]}); }));
  subs.sort((a,b)=>a.k<b.k?1:-1);
  $("apCount").textContent = subs.length? `· ${subs.length} awaiting` : "· all clear";
  if(!subs.length){ $("approvals").innerHTML=`<div class="panel pad sub">Nothing waiting for approval. Submitted timesheets from employees will show up here.</div>`; return; }
  $("approvals").innerHTML = subs.map(s=>{
    const [yy,mm]=s.k.split("-").map(Number);
    const c=C.computeMonth(COMPANY,s.emp,s.rec,yy,mm);
    const L=[];
    L.push([s.emp.type==="salaried"?"Salary hours":"Regular hours", C.fh(c.base)]);
    if(c.hol)L.push(["Holiday",C.fh(c.hol)]); if(c.ot)L.push(["Overtime",C.fh(c.ot)]);
    if(c.vacH)L.push(["Vacation",`${C.fh(c.vacH)} h`]); if(c.sickH)L.push(["Sick",`${C.fh(c.sickH)} h`]); if(c.pdayH)L.push(["Personal",`${C.fh(c.pdayH)} h`]);
    if(c.mileagePay)L.push(["Mileage",C.money(c.mileagePay)]);
    L.push(["Total hours",C.fh(c.total)]);
    return `<div class="item">
      <div class="row"><b>${C.esc(s.emp.firstName)} ${C.esc(s.emp.lastName||"")}</b>
        <span class="pill submitted">Submitted</span><span class="sub">${C.MONTHS[mm-1]} ${yy}</span>
        <span class="spacer"></span>
        <button class="btn green small" data-approve="${s.emp.id}|${s.k}">Approve</button>
        <button class="btn small" data-reject="${s.emp.id}|${s.k}" style="border-color:var(--red);color:var(--red)">Reject</button></div>
      ${s.rec.note?`<div class="sub" style="margin-top:8px">Note: “${C.esc(s.rec.note)}”</div>`:""}
      <div style="margin-top:10px">${L.map(x=>`<div class="kv"><span>${x[0]}</span><b>${x[1]}</b></div>`).join("")}</div>
    </div>`;
  }).join("");
  document.querySelectorAll("[data-approve]").forEach(b=>b.onclick=()=>approve(b.dataset.approve));
  document.querySelectorAll("[data-reject]").forEach(b=>b.onclick=()=>reject(b.dataset.reject));
}

async function approve(key){
  const [empId,k]=key.split("|");
  try{
    await updateDoc(doc(db,"employees",empId,"timesheets",k), {status:"approved", approvedAt:serverTimestamp()});
    const emp=EMPS.find(e=>e.id===empId); if(emp&&emp.months[k]) emp.months[k].status="approved";
    toast("Approved ✓"); renderApprovals();
  }catch(e){ console.error(e); toast("Couldn't approve — "+(e.code||e.message)); }
}
async function reject(key){
  const [empId,k]=key.split("|");
  const reason=prompt("Send this month back to the employee to fix. Optional note explaining what to change:","");
  if(reason===null) return; // cancelled
  try{
    // reset the month to a blank draft (overwrite, no merge) so the rejected values are cleared
    await setDoc(doc(db,"employees",empId,"timesheets",k), {empId, year:+k.slice(0,4), month:+k.slice(5), status:"draft", adminNote:reason||"", rejectedAt:serverTimestamp()});
    const emp=EMPS.find(e=>e.id===empId); if(emp) emp.months[k]={empId, status:"draft", adminNote:reason||""};
    toast("Sent back to employee"); renderApprovals();
  }catch(e){ console.error(e); toast("Couldn't reject — "+(e.code||e.message)); }
}

/* ---------- setup / import ---------- */
function renderSetup(){
  const have = COMPANY && EMPS.length;
  $("setup").innerHTML = `
    <div class="sub" style="margin-bottom:10px">${have?`<b>Import from data.json</b> copies your company settings, holidays, employees, allowances and starting balances from the tracker's data.json into Firebase, and sets each person's login email. You already did the one-time import (company + <b>${EMPS.length}</b> employees). Run it again only if you changed those in data.json or added an employee — it won't touch anyone's submitted timesheets.`:`<b>One-time import:</b> this copies your company settings, holidays, employees, allowances and starting balances from the tracker's <b>data.json</b> into Firebase, and is where you set each employee's login email. Do this once to get started.`}</div>
    <button class="btn" id="loadJson">Load data.json</button>
    <div id="importArea" style="margin-top:14px"></div>`;
  $("loadJson").onclick=loadJson;
}
async function loadJson(){
  let data;
  try{ const r=await fetch("./data.json",{cache:"no-store"}); data=await r.json(); }
  catch(e){ $("importArea").innerHTML=`<div class="err">Couldn't read data.json from this site. Make sure this page is opened from your hosted GitHub Pages URL.</div>`; return; }
  const emps=data.employees||[];
  const existingEmail=id=>{ const e=EMPS.find(x=>x.id===id); return e?e.email:""; };
  $("importArea").innerHTML = `
    <div class="sub" style="margin-bottom:8px">Set the login email for each employee (this is how they sign in on the employee page):</div>
    ${emps.map(e=>`<div class="field"><label class="fl">${C.esc(e.firstName)} ${C.esc(e.lastName||"")} — login email</label>
      <input class="f imp-email" data-id="${C.esc(e.id)}" type="email" placeholder="name@brickellmg.com" value="${C.esc(existingEmail(e.id))}"></div>`).join("")}
    <button class="btn primary" id="doImport">Import to Firestore</button>
    <div class="err" id="impErr"></div>`;
  $("doImport").onclick=()=>doImport(data);
}
async function doImport(data){
  $("impErr").textContent="";
  const emails={}; let bad=false;
  document.querySelectorAll(".imp-email").forEach(i=>{ const v=i.value.trim(); emails[i.dataset.id]=v; if(!v||!v.includes("@")) bad=true; });
  if(bad){ $("impErr").textContent="Give every employee a valid login email first."; return; }
  $("doImport").disabled=true;
  try{
    // company config
    await setDoc(doc(db,"config","company"), {
      name:data.company?.name||"Brickell Management One Corp",
      startYear:data.company?.startYear||2026,
      trackingStart:data.company?.trackingStart||null,
      mileageRate:data.company?.mileageRate??0.65,
      overtimeMultiplier:data.company?.overtimeMultiplier??1.5,
      payrollDay:data.company?.payrollDay??26,
      policy:data.policy||{},
      holidayOverrides:data.holidayOverrides||{}
    }, {merge:true});
    // employees
    for(const e of (data.employees||[])){
      await setDoc(doc(db,"employees",e.id), {
        firstName:e.firstName, lastName:e.lastName||"", type:e.type||"hourly",
        hoursPerDay:e.hoursPerDay||8, hourlyRate:e.hourlyRate??null, annualSalary:e.annualSalary??null,
        monthlyBonus:e.monthlyBonus||0, entitlements:e.entitlements||{}, priorUsed:e.priorUsed||{},
        email:emails[e.id], active:true
      }, {merge:true});
      // import any historical months as approved
      const months=e.months||{};
      for(const k of Object.keys(months)){
        await setDoc(doc(db,"employees",e.id,"timesheets",k),
          Object.assign({}, months[k], {empId:e.id, status:"approved", updatedAt:serverTimestamp()}), {merge:true});
      }
    }
    toast("Imported into Firestore ✓");
    await loadAndRender();
  }catch(e){ console.error(e); $("impErr").textContent="Import failed: "+(e.code||e.message); }
  finally{ $("doImport").disabled=false; }
}
</script>
